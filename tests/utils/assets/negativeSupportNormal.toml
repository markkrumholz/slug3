# A PDF whose domain includes negative values, used only by
# testPDFIntegratorND.cpp to verify that requesting logTransform on a
# dimension whose (clamped) integration bounds are not both strictly
# positive throws std::runtime_error, rather than silently taking
# ln() of a non-positive number.

breakpoints = [-1.0, 1.0]

[segment1]
type = "normal"
mean = 0.0
disp = 0.3
