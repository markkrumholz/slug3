# A single-segment, pure-lognormal PDF used only by
# testPDFIntegratorND.cpp's CubatureMethod::pAdaptive test cases.
# Unlike a power-law-bearing PDF (e.g. chabrier.toml/salpeter.toml),
# a lognormal has no kink and no singularity anywhere near its
# domain, so pcubature's global tensor-product quadrature converges
# on it quickly -- which is the point of these tests, exercising
# PDFIntegratorND's own Method dispatch rather than pcubature's known
# worst case (a PDF with a nearby singularity or a kink).

breakpoints = [0.3, 3.0]

[segment1]
type = "lognormal"
mean = 1.0
disp = 0.2
