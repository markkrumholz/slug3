name: CI

on:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    # Ninja (rather than the Unix Makefiles default) parallelizes the
    # Build step automatically, and ccache -- primed from the cache
    # step below -- turns most of an incremental PR's compilation into
    # cache hits instead of a from-scratch rebuild. CCACHE_DIR is set
    # explicitly since its own OS-specific default differs between
    # Ubuntu and macOS, and the cache step below needs a single,
    # known path to save/restore. CCACHE_SLOPPINESS=time_macros is
    # required, not cosmetic: src/extern/pcg-cpp's pcg_extras.hpp (pulled
    # in almost everywhere via the RNG utilities) uses __TIME__/__DATE__,
    # which by default makes ccache treat every translation unit that
    # includes it as a guaranteed miss on every single build, since the
    # preprocessed output is never bit-identical run to run; this tells
    # ccache to hash those macros as if stable instead (verified locally:
    # without it, a fully warm-cache rebuild only hit ~20% of files;
    # with it, 100%, dropping a full rebuild from ~90s to ~8s on a
    # 12-core machine). The resulting object files can carry a stale
    # embedded __TIME__/__DATE__ from an earlier build if ccache serves
    # them from cache -- harmless here, since pcg_extras.hpp only uses
    # them as a last-resort fallback entropy source, not for anything
    # this project's own reproducibility depends on.
    env:
      CMAKE_GENERATOR: Ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_SLOPPINESS: time_macros

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc-16
            cxx: g++-16
            cxxflags: ''
          - os: ubuntu-latest
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            cxxflags: '-stdlib=libc++'
          - os: macos-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            cxxflags: ''
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            cxxflags: ''

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        # A pinned, non-"externally managed" interpreter so pytest/numpy/
        # h5py/tomlkit/astropy can be pip-installed directly; pointed at
        # explicitly in the Configure step below so CMake/pybind11 build
        # slugPython against this same interpreter, matching what these
        # packages were installed into.
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install pytest numpy h5py tomlkit astropy scipy tqdm

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        # No released libstdc++ (through GCC 16) ships <mdspan> yet, so the
        # gcc leg needs GCC 16 from the toolchain-r PPA. The clang leg sidesteps
        # libstdc++ entirely by linking against libc++ 18, which has had
        # <mdspan> since LLVM 18; mixing a newer libstdc++ into Clang's
        # autodetected search path instead (e.g. via gcc-16) breaks headers
        # (verified locally: Clang 18 fails to parse libstdc++ 16's <span>).
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libgsl-dev libhdf5-dev gcc-16 g++-16 clang-18 libc++-18-dev libc++abi-18-dev ninja-build ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gsl hdf5 ninja ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.compiler }}-

      - name: Configure
        # CMAKE_CXX_SCAN_FOR_MODULES=OFF also matters for ccache, not
        # just build time: with Ninja + C++20-or-later (see
        # CMakeLists.txt's CMAKE_CXX_STANDARD 23), CMake's C++ module
        # dependency scanner adds a per-translation-unit "@....modmap"
        # response-file argument to every compile command, even though
        # this project uses no actual C++ modules -- and that argument
        # defeats ccache's caching entirely (verified locally: identical
        # rebuilds still missed 100% of the time with it present).
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.cxxflags }}" \
            -DPython_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"

      - name: Build
        run: cmake --build build --parallel

      - name: ccache stats
        run: ccache -s

      - name: Test
        working-directory: build
        # Only the "quick" tests -- see CMakeLists.txt's own LABELS
        # comment. Slow, full-scale end-to-end tests need real data
        # files (MIST tracks, POWR/TLUSTY/BOSZ/CK04 spectra) that are
        # gitignored and not fetched here, so they currently no-op
        # (self-skip) on CI regardless; excluding them explicitly
        # keeps CI fast on purpose rather than by accident of what
        # data happens to be present, so it stays fast even once CI
        # does have that data available.
        run: ctest --output-on-failure -L quick

  lint:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        # See the "Install dependencies (Ubuntu)" step in the test job above:
        # clang-tidy needs to parse the same libc++ 18 headers the clang build
        # leg compiles against, since no libstdc++ yet ships <mdspan>.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 libgsl-dev libhdf5-dev libc++-18-dev libc++abi-18-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on changed files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD \
            | grep -E '^src/.*\.(cpp|hpp)$' \
            | grep -v 'pcg-cpp' || true)
          if [ -z "$CHANGED" ]; then
            echo "No C++ source files changed, skipping clang-tidy."
            exit 0
          fi
          echo "$CHANGED" | xargs clang-tidy-18 -p build

  pyright:
    name: pyright
    runs-on: ubuntu-latest

    # See the test job's own identical env comment above.
    env:
      CMAKE_GENERATOR: Ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_SLOPPINESS: time_macros

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: '3.12'

      - name: Install dependencies
        # pyright itself, plus slugpy's own runtime dependencies, so it
        # can resolve their imports (see pyrightconfig.json's own
        # comment on useLibraryCodeForTypes: this only stops pyright
        # from inferring types from their source, not from needing the
        # packages installed at all). Also clang-18 + libc++, exactly
        # as the lint job above installs them: the stock Ubuntu
        # compiler doesn't ship C++23's <mdspan> yet (see AGENTS.md's
        # own Building section), and slugPython needs to actually
        # compile for this job to do anything useful.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev libgsl-dev libhdf5-dev ninja-build ccache
          python -m pip install pyright pytest h5py tomlkit astropy numpy scipy tqdm

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-pyright-${{ github.sha }}
          restore-keys: |
            ccache-pyright-

      - name: Configure
        # See the test job's own identical CMAKE_CXX_SCAN_FOR_MODULES
        # comment above.
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ \
            -DPython_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"

      - name: Build slugPython
        # pyright needs the compiled _slug extension actually present
        # to resolve slugpy's "from ._slug import ..." lines -- without
        # it, every file in the package fails to import at all.
        run: cmake --build build --target slugPython --parallel

      - name: ccache stats
        run: ccache -s

      - name: Run pyright on changed Python files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(slugpy|tests/slugpy)/.*\.py$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No slugpy Python files changed, skipping pyright."
            exit 0
          fi
          # --pythonpath is required: "python -m pyright" does not
          # auto-detect its own interpreter's site-packages, so without
          # it pyright can't resolve h5py/tomlkit/astropy/pytest at all
          # even though this exact interpreter just pip-installed them.
          echo "$CHANGED" | xargs python -m pyright --pythonpath "${{ steps.setup-python.outputs.python-path }}"
