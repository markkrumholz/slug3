[restructuredtext parser]
# Exhale's own generated class/file hierarchy tree-view content
# (cpp_api/*_view_hierarchy.rst.include) lands on a single line that
# grows with the size of the C++ class tree; docutils' own default
# line-length-limit (10000, a DoS-protection default with no relation
# to this project) is already exceeded by slug's own class hierarchy,
# silently dropping that whole section. Raised well above what any
# realistic growth of the C++ tree would need.
line-length-limit: 100000
