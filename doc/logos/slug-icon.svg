<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="oklch(0.9 0.1 80)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="oklch(0.8 0.15 95)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-bright" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="oklch(0.97 0.03 85)"/>
      <stop offset="100%" stop-color="oklch(0.8 0.15 95)"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" rx="34" fill="oklch(0.24 0.055 270)"/>
  <g fill="oklch(0.97 0.01 90)">
    <circle cx="20" cy="30" r="1.6" opacity="0.8"/>
    <circle cx="45" cy="15" r="1.2" opacity="0.6"/>
    <circle cx="14" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="100" cy="20" r="1.3" opacity="0.5"/>
    <circle cx="150" cy="150" r="1.4" opacity="0.5"/>
    <circle cx="175" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="185" cy="95" r="1.3" opacity="0.6"/>
    <circle cx="30" cy="185" r="1.3" opacity="0.5"/>
  </g>
  <g fill="oklch(0.97 0.01 90)">
    <path d="M25,45 L27,40 L29,45 L34,47 L29,49 L27,54 L25,49 L20,47 Z" opacity="0.85"/>
    <path d="M178,140 L179.3,137 L180.6,140 L183.6,141.3 L180.6,142.6 L179.3,145.6 L178,142.6 L175,141.3 Z" opacity="0.7"/>
  </g>

  <!-- galaxy: given more open space, upper right -->
  <circle cx="145" cy="40" r="44" fill="url(#core-glow)"/>
  <g transform="rotate(-22 145 40)">
    <ellipse cx="145" cy="40" rx="40" ry="14" fill="oklch(0.5 0.16 300)" opacity="0.9"/>
    <ellipse cx="145" cy="40" rx="26" ry="8.5" fill="oklch(0.62 0.13 295)" opacity="0.85"/>
    <path d="M119,40 A26,8.5 0 0 1 171,40" stroke="oklch(0.75 0.1 290)" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <path d="M183,32 Q198,38 200,50" stroke="oklch(0.6 0.12 205)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M108,48 Q93,42 90,30" stroke="oklch(0.6 0.12 205)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="145" cy="40" r="8.5" fill="url(#core-bright)"/>

  <!-- telescope on a tripod, centered, scaled down a touch -->
  <g transform="translate(114,178) scale(0.85) translate(-114,-178)">
  <g>
    <!-- tripod legs -->
    <line x1="116" y1="118" x2="78" y2="178" stroke="oklch(0.55 0.03 260)" stroke-width="5" stroke-linecap="round"/>
    <line x1="116" y1="118" x2="150" y2="178" stroke="oklch(0.55 0.03 260)" stroke-width="5" stroke-linecap="round"/>
    <line x1="116" y1="118" x2="120" y2="166" stroke="oklch(0.48 0.03 260)" stroke-width="4" stroke-linecap="round"/>
    <line x1="72" y1="178" x2="84" y2="178" stroke="oklch(0.45 0.03 260)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="144" y1="178" x2="156" y2="178" stroke="oklch(0.45 0.03 260)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- mount head -->
    <circle cx="116" cy="118" r="8" fill="oklch(0.42 0.03 260)"/>
    <!-- tube -->
    <polygon points="99.17,152.76 160.51,78.28 135.49,61.72 90.83,147.24"
             fill="oklch(0.62 0.03 260)" stroke="oklch(0.4 0.03 260)" stroke-width="1.5"/>
    <!-- telescoping rings -->
    <line x1="120.6" y1="126.7" x2="106.5" y2="117.3" stroke="oklch(0.4 0.03 260)" stroke-width="2.5"/>
    <line x1="142.1" y1="100.6" x2="122.1" y2="87.4" stroke="oklch(0.4 0.03 260)" stroke-width="2.5"/>
    <!-- trunnion (pivot ring on the tube) -->
    <circle cx="116" cy="118" r="4.5" fill="oklch(0.35 0.03 260)" stroke="oklch(0.25 0.02 260)" stroke-width="1"/>
    <!-- objective lens (far end, big) -->
    <circle cx="148" cy="70" r="15" fill="oklch(0.85 0.06 210)" stroke="oklch(0.4 0.03 260)" stroke-width="2.5"/>
    <circle cx="143" cy="65" r="4" fill="oklch(0.97 0.02 90)" opacity="0.85"/>
    <!-- eyepiece (near end, small) -->
    <circle cx="95" cy="150" r="5.5" fill="oklch(0.4 0.03 260)" stroke="oklch(0.3 0.03 260)" stroke-width="1.5"/>
    <circle cx="95" cy="150" r="2.2" fill="oklch(0.15 0.02 260)"/>
  </g>
  </g>

  <!-- slug: upright, a bit bigger, moved left -->
  <g transform="translate(55,175) scale(1.2) translate(-55,-175)">
  <g>
    <!-- body: tapered banana-slug tail -->
    <path d="M61,126 Q30,138 36,172 Q52,190 77,157 Z" fill="oklch(0.8 0.15 95)"/>
    <circle cx="70" cy="140" r="18" fill="oklch(0.8 0.15 95)"/>
    <!-- belly foot stripe -->
    <path d="M36,172 Q52,190 77,157 L70,150 Q46,178 40,162 Z" fill="oklch(0.68 0.15 70)" opacity="0.65"/>
    <!-- back speckles -->
    <g fill="oklch(0.5 0.1 70)" opacity="0.55">
      <circle cx="50" cy="135" r="1.8"/>
      <circle cx="44" cy="150" r="1.5"/>
      <circle cx="56" cy="148" r="1.3"/>
      <circle cx="46" cy="163" r="1.6"/>
    </g>
    <!-- antennae (rhinophores + lower tentacles, like a real banana slug) -->
    <g stroke="oklch(0.8 0.15 95)" fill="none" stroke-linecap="round">
      <path d="M64,124 Q56,110 51,100" stroke-width="4.5"/>
      <path d="M79,121 Q87,108 92,99" stroke-width="4.5"/>
      <path d="M58,146 Q49,152 44,159" stroke-width="3"/>
      <path d="M83,142 Q92,147 98,153" stroke-width="3"/>
    </g>
    <g fill="oklch(0.8 0.15 95)">
      <circle cx="51" cy="100" r="4.2"/>
      <circle cx="92" cy="99" r="4.2"/>
      <circle cx="44" cy="159" r="3"/>
      <circle cx="98" cy="153" r="3"/>
    </g>
    <g fill="oklch(0.5 0.1 70)" opacity="0.6">
      <circle cx="51" cy="100" r="1.6"/>
      <circle cx="92" cy="99" r="1.6"/>
    </g>
    <!-- face, looking toward the eyepiece -->
    <circle cx="63" cy="132" r="5.5" fill="oklch(0.97 0.02 90)"/>
    <circle cx="64.3" cy="130.2" r="2.2" fill="oklch(0.22 0.04 270)"/>
    <circle cx="77" cy="129" r="5.5" fill="oklch(0.97 0.02 90)"/>
    <circle cx="78.3" cy="127.2" r="2.2" fill="oklch(0.22 0.04 270)"/>
    <!-- smile -->
    <path d="M66,146 Q71,150 76,146" stroke="oklch(0.4 0.1 50)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  </g>
</svg>
