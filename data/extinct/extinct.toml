name = "Registry of extinction curves"
file = "extinct.h5"
curves = ["Bouchet_SMC", "Calzetti_LMC", "Calzetti_MW", "Calzetti_starburst"]

[Calzetti_starburst]
reference = "Calzetti, D., Armus, L., Bohlin, R., et al. 2000, ApJ, 533, 682"
reference_url = "https://ui.adsabs.harvard.edu/abs/2000ApJ...533..682C/abstract"
description = "Calzetti starburst attenuation curve"

[Calzetti_MW]
reference = ["Landini, E., Natta, A., Oliva, E., et al. 1984, A&A, 134, 284", "Fitzpatrick, E. 1999, PASP, 111, 63", "D. Calzetti, personal comm."]
reference_url = ["https://ui.adsabs.harvard.edu/abs/1984A%26A...134..284L/abstract", "https://ui.adsabs.harvard.edu/abs/1999PASP..111...63F/abstract"]
description = "Calzetti Milky Way extinction curve"

[Calzetti_LMC]
reference = ["Landini, E., Natta, A., Oliva, E., et al. 1984, A&A, 134, 284", "Fitzpatrick, E. 1999, PASP, 111, 63", "D. Calzetti, personal comm."]
reference_url = ["https://ui.adsabs.harvard.edu/abs/1984A%26A...134..284L/abstract", "https://ui.adsabs.harvard.edu/abs/1999PASP..111...63F/abstract"]
description = "Calzetti LMC extinction curve"

[Bouchet_SMC]
reference = "Bouchet, P., Lequeux, J., Maurice, E., et al. 1985, A&A, 149, 330"
reference_url = "https://ui.adsabs.harvard.edu/abs/1985A%26A...149..330B/abstract"
description = "Bouchet SMC extinction curve"
