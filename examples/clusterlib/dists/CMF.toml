# Cluster mass function for the clusterlib example: a Schechter
# distribution (a powerlaw of slope alpha with an exponential cutoff
# above x_star) with alpha = -2 and x_star = 1e5 Msun. Breakpoints set
# the mass range this is sampled over: 100 Msun (a typical minimum
# bound-cluster mass) to 1e7 Msun -- well above x_star, so the
# exponential cutoff, not this upper bound, is what actually shapes
# the high-mass tail.

breakpoints = [1e2, 1e7]

[segment1]
type = "schechter"
slope = -2
x_star = 1e5
